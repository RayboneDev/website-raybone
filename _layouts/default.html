<!doctype html>
{% assign current_lang = page.lang | default: 'fa' %}
{% if current_lang == 'en' %}{% assign text_direction = 'ltr' %}{% else %}{% assign text_direction = 'rtl' %}{% endif %}
<html lang="{{ current_lang }}" dir="{{ text_direction }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  {{ content }}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
