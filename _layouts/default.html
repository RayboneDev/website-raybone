<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title | default: "رایبُن | Raybone" }}</title>

    <!-- اتصال فایل CSS اختصاصی نهایی (شامل فونت‌های لوکال و Tailwind کامپایل‌شده) -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <style>
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .dropdown-menu {
            display: none;
        }

        .dropdown:hover .dropdown-menu {
            display: block;
        }
    </style>
</head>


<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-200 font-sans selection:bg-indigo-500 selection:text-white">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-md bg-white/80 dark:bg-zinc-950/80 border-b border-zinc-200 dark:border-zinc-800">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            
            <!-- Logo -->
            <a href="{{ '/' | relative_url }}" class="flex items-center gap-3">
                <img src="{{ '/assets/logo/raybone-logo.webp' | relative_url }}" alt="Raybone Logo" class="h-10 w-auto">
            </a>

            <!-- Desktop Menu (Hidden on Mobile) -->
            <div class="hidden md:flex items-center space-x-reverse space-x-8 text-sm font-medium">
                <a href="#" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">صنایع</a>
                <a href="#" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">راهکارها</a>
                <a href="{{ '/about/' | relative_url }}" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">درباره رایبُن</a>
                <a href="{{ 'javascript:void(0)' | relative_url }}" class="text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 transition-colors">وبلاگ</a>
                <a href="{{ '/knowledge/' | relative_url }}" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">دانشنامه</a>
                <a href="{{ '/branding/' | relative_url }}" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 font-medium transition-colors">نشان رایبُن</a>
            </div>

            <!-- Action Buttons & Toggles -->
            <div class="flex items-center gap-2 md:gap-4">
                
                <!-- Dark Mode Toggle -->
                <button id="theme-toggle" class="p-2 rounded-full text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path>
                    </svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-zinc-600" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>

                <!-- CTA Button (Hidden on very small screens, visible on md) -->
                <a href="#" class="hidden sm:inline-flex px-5 py-2 rounded-full bg-indigo-600 text-white font-medium hover:bg-indigo-700 shadow-md shadow-indigo-600/20 dark:bg-indigo-500 dark:hover:bg-indigo-400 dark:text-zinc-50 transition-all transform hover:-translate-y-0.5">گفتگو با ما</a>

                <!-- Mobile Hamburger Button -->
                <button id="mobile-menu-toggle" class="md:hidden p-2 rounded-lg text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 focus:outline-none transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu Dropdown (Hidden by Default) -->
        <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-zinc-950 border-t border-zinc-200 dark:border-zinc-800 shadow-lg absolute w-full left-0">
            <div class="flex flex-col px-6 py-4 space-y-4 text-sm font-medium">
                <a href="#" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">صنایع</a>
                <a href="#" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">راهکارها</a>
                <a href="{{ '/about/' | relative_url }}" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">درباره رایبُن</a>
                <a href="{{ 'javascript:void(0)' | relative_url }}" class="text-indigo-600 dark:text-indigo-400 transition-colors">وبلاگ</a>
                <a href="{{ '/knowledge/' | relative_url }}" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">دانشنامه</a>
                <a href="{{ '/branding/' | relative_url }}" class="text-zinc-600 dark:text-zinc-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors">نشان رایبُن</a>
                
                <!-- CTA Button for Mobile -->
                <a href="#" class="sm:hidden text-center mt-4 px-5 py-2.5 rounded-full bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-all">گفتگو با ما</a>
            </div>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <!-- Scripts (Dark Mode & Mobile Menu) -->
    <script>
        // --- Mobile Menu Logic ---
        const mobileBtn = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');

        mobileBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        // --- Dark Mode Logic ---
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        document.getElementById('theme-toggle').addEventListener('click', function () {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });
    </script>
</body>
</html>
